# documentation.

name: Psalm Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  psalm-analysis:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Bootstrap Psalm Laravel Plugin
        run: vendor/bin/psalm-plugin enable psalm/plugin-laravel || true

      - name: Run Psalm Scan
        run: vendor/bin/psalm --output-format=github