# documentation.

name: Psalm Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  psalm-analysis:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl
          tools: psalm

      - name: Prepare environment for Psalm
        run: |
          mkdir -p database
          cp .env.example .env 2>/dev/null || echo "APP_ENV=testing" > .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=/tmp/psalm-test.sqlite" >> .env
          touch /tmp/psalm-test.sqlite
          php artisan key:generate --quiet 2>/dev/null || true

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Psalm Scan
        run: psalm --output-format=github || true