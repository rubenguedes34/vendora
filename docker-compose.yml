# Run the whole stack with: docker compose up --build
#
#   Frontend      http://localhost:4200
#   Backend API   http://localhost:8000
#   Admin panel   http://localhost:8000/admin
#
# Required: DB_PASSWORD and DB_ROOT_PASSWORD, in a .env file next to this one (see
# .env.docker.example). There are no default passwords. Other settings are optional.

services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-vendora}
      MYSQL_USER: ${DB_USERNAME:-vendora}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.docker.example)}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env (see .env.docker.example)}
    volumes:
      - database-data:/var/lib/mysql
    ports:
      # 3307 on the host so it does not clash with a local MySQL on 3306, and
      # bound to loopback so the database is not reachable from the LAN.
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    # API keys (Google, Finnhub, OpenAI, APP_KEY...) are picked up from
    # backend/.env when it exists; the values below always win.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:4200
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-vendora}
      DB_USERNAME: ${DB_USERNAME:-vendora}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.docker.example)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      LOG_CHANNEL: stderr
      AI_SUPPORT_PROVIDER: ${AI_SUPPORT_PROVIDER:-ollama}
      AI_SUPPORT_MODELS: ${AI_SUPPORT_MODELS:-llama3.2:3b,llama3.2:1b}
      OLLAMA_URL: http://ollama:11434
      # Bank statement category suggestions: the better 3B model only, with time for a CPU-only host.
      AI_STATEMENT_MODELS: ${AI_STATEMENT_MODELS:-llama3.2:3b}
      AI_STATEMENT_TIMEOUT: ${AI_STATEMENT_TIMEOUT:-120}
      MAX_UPLOAD_KB: ${MAX_UPLOAD_KB:-5120}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
    volumes:
      - backend-storage:/app/storage
    ports:
      # The frontend bundle and CORS config expect these exact ports.
      - "8000:8000"
    # The entrypoint finishes migrations/seeding before the server starts
    # listening, so an open port means the backend is ready.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s

  # Local model for the AI support chat. The model downloads on first start; until
  # then (or if this service is down) the chat falls back to FAQ matching.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      # Keep the model in RAM so the first question after idle is not slow.
      OLLAMA_KEEP_ALIVE: 24h
    entrypoint: ["/bin/sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 2; done; for m in $$(echo '${AI_SUPPORT_MODELS:-llama3.2:3b,llama3.2:1b}' | tr ',' ' '); do i=0; until ollama pull $$m; do i=$$((i+1)); if [ $$i -ge 20 ]; then echo \"Giving up on ollama model $$m after 20 tries; the chat will use FAQ matching.\"; break; fi; echo \"Pull of ollama model $$m failed, retrying ($$i/20)\"; sleep 5; done; done; wait"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      # Loopback only: Ollama has no authentication. Use OLLAMA_HOST_PORT if you
      # run a native Ollama on the host and 11434 clashes.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"

  # Starts only once the backend is healthy, and prints the "up and running"
  # banner on start, so it is the last thing shown by `docker compose up`.
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  database-data:
  backend-storage:
  ollama-data:
