<div class="relative">
  <div class="flex items-center bg-white border border-gray-200 rounded-xl p-0.5">
    <button
      type="button"
      (click)="shift(-1)"
      [attr.aria-label]="'transactions.prevMonth' | translate"
      class="p-2.5 sm:p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>
    <button
      type="button"
      (click)="toggle()"
      aria-haspopup="true"
      [attr.aria-expanded]="open()"
      class="px-2 text-sm font-semibold text-gray-800 tabular-nums min-w-[8.5rem] text-center capitalize"
    >
      {{ label() }}
    </button>
    <button
      type="button"
      (click)="shift(1)"
      [attr.aria-label]="'transactions.nextMonth' | translate"
      class="p-2.5 sm:p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>

  @if (open()) {
    <div
      class="absolute right-0 top-12 z-50 w-64 bg-white rounded-2xl border border-gray-200 shadow-xl p-3"
    >
      <div class="flex items-center justify-between mb-2">
        <button
          type="button"
          (click)="pickerYear.set(pickerYear() - 1)"
          [attr.aria-label]="'dashboard.picker.prevYear' | translate"
          class="p-2.5 sm:p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
        <span class="text-sm font-semibold text-gray-800 tabular-nums">{{ pickerYear() }}</span>
        <button
          type="button"
          (click)="pickerYear.set(pickerYear() + 1)"
          [attr.aria-label]="'dashboard.picker.nextYear' | translate"
          class="p-2.5 sm:p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
      </div>
      <div class="grid grid-cols-3 gap-1.5">
        @for (m of months(); track m) {
          <button
            type="button"
            (click)="pick(m)"
            class="py-2 rounded-lg text-sm font-medium capitalize transition-colors"
            [ngClass]="{
              'bg-primary-600 text-white': m === month(),
              'text-gray-700 hover:bg-gray-100': m !== month(),
              'ring-1 ring-primary-300': m === currentMonth,
            }"
          >
            {{ name(m, 'short') }}
          </button>
        }
      </div>
      <div class="mt-3 pt-3 border-t border-gray-100 flex justify-between">
        @if (allowAll()) {
          <button
            type="button"
            (click)="pick('')"
            class="text-xs font-semibold text-gray-500 hover:text-gray-700"
          >
            {{ 'transactions.allMonths' | translate }}
          </button>
        } @else {
          <span></span>
        }
        <button
          type="button"
          (click)="pick(currentMonth)"
          class="text-xs font-semibold text-primary-600 hover:text-primary-700"
        >
          {{ 'dashboard.picker.thisMonth' | translate }}
        </button>
      </div>
    </div>
  }
</div>
