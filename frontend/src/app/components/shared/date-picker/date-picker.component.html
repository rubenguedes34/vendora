<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled()"
    aria-haspopup="true"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel() || null"
    class="w-full flex items-center justify-between gap-2 text-left focus:outline-none focus:ring-2 focus:ring-primary-400 {{
      triggerClass()
    }}"
  >
    <span class="truncate">{{ label() }}</span>
    <svg
      class="w-4 h-4 shrink-0 text-gray-400"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
      />
    </svg>
  </button>

  @if (open()) {
    <div
      class="absolute left-0 top-full mt-2 z-50 w-72 bg-white rounded-2xl border border-gray-200 shadow-xl p-3"
    >
      <div class="flex items-center justify-between mb-2">
        <button
          type="button"
          (click)="shift(-1)"
          [attr.aria-label]="'transactions.prevMonth' | translate"
          class="p-2.5 sm:p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
        <span class="text-sm font-semibold text-gray-800 capitalize">{{ title() }}</span>
        <button
          type="button"
          (click)="shift(1)"
          [attr.aria-label]="'transactions.nextMonth' | translate"
          class="p-2.5 sm:p-1.5 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-gray-800 transition-colors"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </button>
      </div>
      <div class="grid grid-cols-7 gap-1 mb-1">
        @for (w of weekdays(); track $index) {
          <span class="text-center text-xs font-medium text-gray-400">{{ w }}</span>
        }
      </div>
      <div class="grid grid-cols-7 gap-1">
        @for (d of days(); track d.iso) {
          <button
            type="button"
            (click)="pick(d.iso)"
            class="py-1.5 rounded-lg text-sm tabular-nums transition-colors"
            [ngClass]="{
              'bg-primary-600 text-white font-semibold': d.iso === value(),
              'text-gray-700 hover:bg-gray-100': d.iso !== value() && !d.outside,
              'text-gray-300 hover:bg-gray-100': d.iso !== value() && d.outside,
              'ring-1 ring-primary-300': d.iso === today && d.iso !== value(),
            }"
          >
            {{ d.day }}
          </button>
        }
      </div>
      <div class="mt-3 pt-3 border-t border-gray-100 flex justify-between">
        @if (clearable()) {
          <button
            type="button"
            (click)="pick('')"
            class="text-xs font-semibold text-gray-500 hover:text-gray-700"
          >
            {{ 'transactions.clear' | translate }}
          </button>
        } @else {
          <span></span>
        }
        <button
          type="button"
          (click)="pick(today)"
          class="text-xs font-semibold text-primary-600 hover:text-primary-700"
        >
          {{ 'transactions.today' | translate }}
        </button>
      </div>
    </div>
  }
</div>
