server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx drops server-level add_header once a location sets its own, so the
    # security headers are repeated in each location below.

    # Angular handles routing on the client, so unknown paths fall back to index.html.
    # no-cache makes browsers revalidate index.html, so a deploy is picked up (it points to the hashed bundles).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # The service worker and its manifests must always be revalidated, otherwise updates never arrive.
    # Declared before the extension regex below: nginx prefers the first matching regex location.
    location ~* ^/(ngsw-worker\.js|ngsw\.json|manifest\.webmanifest|icons/.+)$ {
        # .webmanifest is not in nginx's mime.types; this only applies to files with no known type.
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Hashed build assets can be cached for a long time.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
